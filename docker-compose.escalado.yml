# Plan de prueba 1 - Escalado horizontal: agrega 2 esclavos (mariadb-slave3 y mariadb-slave4)
# al stack base. Se usa SIEMPRE junto con docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.escalado.yml up -d --wait
#
# Los esclavos nuevos arrancan vacios y copian todo el historial del maestro por GTID.
# Requiere que mariadb-master sea el maestro actual (el init de esclavo apunta a el).

x-esclavo-extra: &esclavo-extra
  image: mariadb:10.11
  restart: unless-stopped
  env_file: [lab.env]
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 30s
  depends_on:
    mariadb-master:
      condition: service_healthy
  networks: [dbnet]

services:
  mariadb-slave3:
    <<: *esclavo-extra
    container_name: mariadb-slave3
    hostname: mariadb-slave3
    command:
      - --server-id=4
      - --report-host=mariadb-slave3
      - --log-bin=mariadb-bin
      - --log-slave-updates=ON
      - --binlog-format=ROW
      - --skip-name-resolve
      - --rpl-semi-sync-master-enabled=ON
      - --rpl-semi-sync-slave-enabled=ON
      - --rpl-semi-sync-master-timeout=10000
      - --rpl-semi-sync-master-wait-point=AFTER_SYNC
      - --rpl-semi-sync-master-wait-no-slave=OFF
    ports: ["3310:3306"]
    volumes:
      - slave3-data:/var/lib/mysql
      - ./mariadb/init/slave:/docker-entrypoint-initdb.d:ro

  mariadb-slave4:
    <<: *esclavo-extra
    container_name: mariadb-slave4
    hostname: mariadb-slave4
    command:
      - --server-id=5
      - --report-host=mariadb-slave4
      - --log-bin=mariadb-bin
      - --log-slave-updates=ON
      - --binlog-format=ROW
      - --skip-name-resolve
      - --rpl-semi-sync-master-enabled=ON
      - --rpl-semi-sync-slave-enabled=ON
      - --rpl-semi-sync-master-timeout=10000
      - --rpl-semi-sync-master-wait-point=AFTER_SYNC
      - --rpl-semi-sync-master-wait-no-slave=OFF
    ports: ["3311:3306"]
    volumes:
      - slave4-data:/var/lib/mysql
      - ./mariadb/init/slave:/docker-entrypoint-initdb.d:ro

volumes:
  slave3-data:
  slave4-data:
